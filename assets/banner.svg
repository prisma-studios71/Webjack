<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <radialGradient id="felt" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1a7d4c"/>
      <stop offset="50%" stop-color="#0f5a36"/>
      <stop offset="100%" stop-color="#073a22"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe69a"/>
      <stop offset="55%" stop-color="#e8c35a"/>
      <stop offset="100%" stop-color="#a8822a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#felt)"/>
  <rect x="14" y="14" width="1172" height="332" rx="18" fill="none" stroke="#e8c35a" stroke-opacity=".45" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="312" rx="14" fill="none" stroke="#e8c35a" stroke-opacity=".18" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- cards -->
  <g filter="url(#shadow)" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
    <g transform="translate(120 70) rotate(-12)">
      <rect width="150" height="210" rx="14" fill="#fdfcf7" stroke="#d8d4c4"/>
      <text x="14" y="42" font-size="36" fill="#1b1b1b">A</text>
      <text x="16" y="74" font-size="30" fill="#1b1b1b">♠</text>
      <text x="75" y="138" font-size="84" fill="#1b1b1b" text-anchor="middle">♠</text>
    </g>
    <g transform="translate(210 80) rotate(8)">
      <rect width="150" height="210" rx="14" fill="#fdfcf7" stroke="#d8d4c4"/>
      <text x="14" y="42" font-size="36" fill="#c62828">K</text>
      <text x="16" y="74" font-size="30" fill="#c62828">♥</text>
      <text x="75" y="138" font-size="84" fill="#c62828" text-anchor="middle">♥</text>
    </g>
  </g>

  <!-- chips -->
  <g filter="url(#shadow)">
    <g transform="translate(1100 268)">
      <circle r="46" fill="#e53935"/><circle r="46" fill="none" stroke="#fff" stroke-width="8" stroke-dasharray="12 12"/>
      <circle r="30" fill="#e53935" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
      <text y="9" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">50</text>
    </g>
    <g transform="translate(1040 178)">
      <circle r="46" fill="#212121"/><circle r="46" fill="none" stroke="#e8c35a" stroke-width="8" stroke-dasharray="12 12"/>
      <circle r="30" fill="#212121" stroke="#e8c35a" stroke-opacity=".6" stroke-width="2"/>
      <text y="9" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#e8c35a" text-anchor="middle">100</text>
    </g>
    <g transform="translate(1110 88)">
      <circle r="40" fill="#8e24aa"/><circle r="40" fill="none" stroke="#fff" stroke-width="7" stroke-dasharray="10 11"/>
      <circle r="26" fill="#8e24aa" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
      <text y="8" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">500</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <text x="665" y="170" font-size="104" font-weight="900" letter-spacing="10" fill="url(#gold)" filter="url(#shadow)">WEBJACK</text>
    <text x="665" y="222" font-size="26" font-weight="600" letter-spacing="3" fill="#f3f1e8">♠ ♥  BLACKJACK W PRZEGLĄDARCE  ♦ ♣</text>
    <text x="665" y="262" font-size="19" fill="#b6c8bb">bez kasy · bez instalacji · idealny na nudną lekcję 😴➡️🤑</text>
  </g>
</svg>
